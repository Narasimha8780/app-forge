# Trigger configuration file: admin/cloudbuild.yaml; build context: repository root.
# Runtime database settings and Secret Manager bindings are configured on Cloud Run.
substitutions:
  _SERVICE_NAME: devmatrix-admin
  _REGION: us-central1
  _ARTIFACT_REPOSITORY: narasimha8780

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: node:24-bookworm-slim
    entrypoint: bash
    args: ['-ceu', 'npm ci --no-audit --no-fund && npm test']
    id: Test

  - name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args:
      - build
      - --target=runtime
      - -f
      - admin/Dockerfile
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/devmatrix-admin:$BUILD_ID'
      - .
    id: Build-admin

  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/devmatrix-admin:$BUILD_ID']
    id: Push-admin

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/devmatrix-admin:$BUILD_ID'
      - '--region=${_REGION}'
      - --platform=managed
      - --port=8080
      # The browser login is public; all customer data APIs enforce DB admin roles.
      - --allow-unauthenticated
      - --quiet
    id: Deploy-admin

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/devmatrix-admin:$BUILD_ID'
timeout: 1200s
