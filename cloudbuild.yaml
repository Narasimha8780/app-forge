# Deploy this app-forge repository to Cloud Run.
# Set _SERVICE_NAME in the Cloud Build trigger. Configure runtime ENVs and secrets in Cloud Run.
options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: node:24-bookworm-slim
    entrypoint: bash
    args: ["-ceu", "npm ci --no-audit --no-fund && npm test"]
    id: Testing the application

  # A missing cache is expected on the first build; the build itself must succeed.
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - 'docker pull us-central1-docker.pkg.dev/$PROJECT_ID/narasimha8780/app-forge/web:latest || echo "Cache unavailable; building without it."'
    id: Pulling cached image

  - name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args:
      - build
      - --target
      - runtime
      - -t
      - "us-central1-docker.pkg.dev/$PROJECT_ID/narasimha8780/app-forge/web/$BRANCH_NAME:$COMMIT_SHA"
      - --cache-from
      - "us-central1-docker.pkg.dev/$PROJECT_ID/narasimha8780/app-forge/web:latest"
      - --build-arg
      - BUILDKIT_INLINE_CACHE=1
      - -f
      - Dockerfile
      - .
    id: Building the container image

  - name: gcr.io/cloud-builders/docker
    args:
      [
        "tag",
        "us-central1-docker.pkg.dev/$PROJECT_ID/narasimha8780/app-forge/web/$BRANCH_NAME:$COMMIT_SHA",
        "us-central1-docker.pkg.dev/$PROJECT_ID/narasimha8780/app-forge/web:latest",
      ]
    id: Tagging as latest

  - name: gcr.io/cloud-builders/docker
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/$PROJECT_ID/narasimha8780/app-forge/web/$BRANCH_NAME:$COMMIT_SHA",
      ]
    id: Pushing the image to registry

  - name: gcr.io/cloud-builders/docker
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/$PROJECT_ID/narasimha8780/app-forge/web:latest",
      ]
    id: Pushing latest tag

  - name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - "${_SERVICE_NAME}"
      - "--image=us-central1-docker.pkg.dev/$PROJECT_ID/narasimha8780/app-forge/web/$BRANCH_NAME:$COMMIT_SHA"
      - "--region=us-central1"
      - --platform=managed
      - --allow-unauthenticated
      - --quiet
    id: Deploying to Cloud Run

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        service_url=$$(gcloud run services describe '${_SERVICE_NAME}' --region='us-central1' --format='value(status.url)')
        curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "$${service_url}/api/health"
    id: Checking deployed health

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/narasimha8780/app-forge/web/$BRANCH_NAME:$COMMIT_SHA"
  - "us-central1-docker.pkg.dev/$PROJECT_ID/narasimha8780/app-forge/web:latest"

timeout: 1200s
